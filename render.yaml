services:
  - type: web
    name: file-service
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 3001
      - key: B2_ENDPOINT
        sync: false
      - key: B2_REGION
        sync: false
      - key: B2_BUCKET
        sync: false
      - key: B2_KEY_ID
        sync: false
      - key: B2_APP_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_SECRET_IS_BASE64
        value: "true"
      - key: MAX_FILE_SIZE_BYTES
        value: "5242880"
      - key: PRESIGNED_URL_TTL_SECONDS
        value: "300"
